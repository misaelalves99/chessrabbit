services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chessrabbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: chessrabbit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessrabbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"   # host 6380: 6379 is taken by another local project
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chessrabbit:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/chessrabbit
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/srv:cached
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  engine:
    build:
      context: ./services/engine
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chessrabbit:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/chessrabbit
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/engine:/srv:cached
    # Engine workers are CPU-bound. Tune to leave cores for API/DB.
    deploy:
      resources:
        limits:
          cpus: "4.0"
    command: python worker.py

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/srv:cached
      - /srv/node_modules
      - /srv/.next
    command: npm run dev

volumes:
  pgdata:
  redisdata:
