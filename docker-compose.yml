services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chessrabbit
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: chessrabbit
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessrabbit"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://chessrabbit:devpassword@postgres:5432/chessrabbit
      REDIS_URL: redis://redis:6379/0
      LOCAL_MODE: "true"
      ENVIRONMENT: development
      APP_BASE_URL: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  engine:
    build: ./services/engine
    environment:
      DATABASE_URL: postgresql://chessrabbit:devpassword@postgres:5432/chessrabbit
      REDIS_URL: redis://redis:6379/0
      ENGINE_WORKERS: "1"
      ENGINE_THREADS_PER_JOB: "2"
      ENGINE_HASH_MB: "64"
    volumes: ["./engines:/engines:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.local
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
