# Production overrides (SCALABILITY_PLAN.md Phase 0.3).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Dev compose runs single-process reload servers; these overrides run real
# process managers. DB pool math: 4 uvicorn workers x (pool 5 + overflow 5)
# = 40 Postgres connections max, safely under the default 100.

# Before using this on a public host, read docs/SECURITY.md. In particular:
# postgres and redis are bound to 127.0.0.1 in the base file and must stay that
# way (Docker's own iptables rules bypass ufw, so a published port is reachable
# from the internet whatever the firewall says), and this file publishes the API
# on :8000 in clear - put TLS in front of it and set ENABLE_HSTS=true.

services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped

  engine:
    restart: unless-stopped

  # `next start` is gone: next.config.js sets output:"export", so the build
  # emits a static bundle into ./out and there is no Node server to run.
  # This serves it locally; in production a CDN serves ./out and this whole
  # service can be dropped (docs/DEPLOYMENT.md).
  #
  # NEXT_PUBLIC_* are inlined at build time, so they belong on the build, not
  # on the running container. Override them for a real deployment.
  web:
    command: sh -c "npm run build && node serve-static.mjs"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${APP_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${APP_WS_URL:-ws://localhost:8000}
      # Also the CSP's connect-src, read at container start by
      # serve-static.mjs. Off by default because this compose file serves
      # plain http; turn it on once TLS terminates in front.
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
