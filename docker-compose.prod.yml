# Production overrides (SCALABILITY_PLAN.md Phase 0.3).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Dev compose runs single-process reload servers; these overrides run real
# process managers. DB pool math: 4 uvicorn workers x (pool 5 + overflow 5)
# = 40 Postgres connections max, safely under the default 100.

services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped

  engine:
    restart: unless-stopped

  web:
    command: sh -c "npm run build && npm run start"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
